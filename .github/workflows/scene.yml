name: iOS Build & UIScene Migration

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual runs

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable UIScene migration
        run: flutter config --enable-uiscene-migration

      - name: Get dependencies
        run: flutter pub get

      # Optional: Run tests
      - name: Run tests
        run: flutter test

      # Build the iOS app
      - name: Build iOS app
        run: flutter build ios --no-codesign

      # Check if flutter config made changes and push to new branch
      - name: Commit UIScene migration changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            branch_name="ios-uiscene-update-$(date +%Y%m%d%H%M%S)"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch_name"
            git add .
            git commit -m "Enable UIScene migration and update iOS project files"
            git push origin "$branch_name"
            echo "✅ Changes pushed to branch: $branch_name"
          else
            echo "No changes detected after UIScene migration."
          fi
