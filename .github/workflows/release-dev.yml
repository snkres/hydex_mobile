name: Development Release

on:
  push:
    branches: [ dev, develop ]
  workflow_dispatch:
    inputs:
      skip_ios:
        description: 'Skip iOS TestFlight deployment'
        type: boolean
        default: false
      skip_android:
        description: 'Skip Android Internal Testing deployment'
        type: boolean
        default: false

jobs:
  ios_testflight:
    if: ${{ !inputs.skip_ios }}
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable' # Use latest stable instead of specific version
        channel: 'stable'
        
    - name: Install Flutter dependencies
      run: flutter pub get
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install CocoaPods
      run: |
        cd ios
        pod install --repo-update
        
    - name: Cache Fastlane
      uses: actions/cache@v3
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
        
    - name: Install Fastlane
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
        
    - name: Setup App Store Connect API Key
      run: |
        echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 -d > AuthKey.p8
        
    - name: Import iOS Certificates
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      run: |
        bundle exec fastlane ios certificates
        
    - name: Build and Deploy iOS to TestFlight
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_PATH: "./AuthKey.p8"
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        bundle exec fastlane ios beta
        
    - name: Clean up
      if: always()
      run: rm -f AuthKey.p8

  android_internal:
    if: ${{ !inputs.skip_android }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable' # Use latest stable instead of specific version
        channel: 'stable'
          
    - name: Install Flutter dependencies
      run: flutter pub get
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        
    - name: Install Fastlane
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
        
    - name: Setup Google Play Service Account
      run: |
        echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 -d > google-play-service-account.json
        
    - name: Setup Android Keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/release.keystore
        
    - name: Build and Deploy Android to Internal Testing
      env:
        GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: "./google-play-service-account.json"
        ANDROID_KEYSTORE_PATH: "./android/app/release.keystore"
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        bundle exec fastlane android beta
        
    - name: Clean up
      if: always()
      run: |
        rm -f google-play-service-account.json
        rm -f android/app/release.keystore